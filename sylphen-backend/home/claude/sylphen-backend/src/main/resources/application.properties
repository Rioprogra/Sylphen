# ============================================================
#  SYLPHEN — application.properties
#  Fase 1: H2 en memoria (sin MySQL real)
#  Fase 2: descomentar bloque MySQL y comentar bloque H2
# ============================================================

# ---- SERVIDOR --------------------------------------------
server.port=8080

# Nombre de la aplicación (aparece en logs de arranque)
spring.application.name=sylphen-backend


# ============================================================
#  BASE DE DATOS — FASE 1: H2 EN MEMORIA
#  Funciona sin instalar MySQL. Solo para desarrollo y pruebas.
#  Los datos se borran al reiniciar la aplicación.
# ============================================================
spring.datasource.url=jdbc:h2:mem:sylphendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto de H2 para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: crea las tablas al arrancar y las borra al cerrar
# Cambiar a 'update' en Fase 2 con MySQL
spring.jpa.hibernate.ddl-auto=create-drop

# Ver las consultas SQL generadas en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 disponible en http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:sylphendb | usuario: sa | password: (vacío)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ============================================================
#  BASE DE DATOS — FASE 2: MySQL REAL
#  Descomentar estas líneas cuando MySQL esté instalado y configurado.
#  Comentar el bloque H2 de arriba antes de activar esto.
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/sylphen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=tu_contraseña_aqui
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true


# ============================================================
#  JPA / HIBERNATE
# ============================================================
# Inicialización diferida: mejora el arranque en desarrollo
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Evitar warnings de proxy de Hibernate con Java 21
spring.jpa.open-in-view=false


# ============================================================
#  CORS — Orígenes permitidos para el frontend
#  Agregar la IP del servidor donde corra el frontend con Live Server
# ============================================================
sylphen.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://192.168.100.192

# ============================================================
#  LOGS
# ============================================================
logging.level.com.sylphen=DEBUG
logging.level.org.springframework.web=INFO
