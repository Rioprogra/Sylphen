# ============================================================
#  SYLPHEN — application.properties
#  Conectado a MariaDB via XAMPP
# ============================================================

server.port=8080
spring.application.name=sylphen-backend

# ---- MariaDB (XAMPP) ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sylphen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- CORS ---------------------------------------------------
sylphen.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# ---- LOGS ---------------------------------------------------
logging.level.com.sylphen=DEBUG
logging.level.org.springframework.web=INFO
